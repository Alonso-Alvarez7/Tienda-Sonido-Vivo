spring.application.name=sonidoVivoApi
server.port=8080

#Estara activo el MySQL, pero si se necesita probar el H2
#pone un  "#" para comentar esta unica linea de codigo de abajo,
#y utilizaras el H2
spring.profiles.active=mysql

# ===== Base de datos H2 en memoria (etapa de desarrollo) =====
spring.datasource.url=jdbc:h2:mem:sonidovivo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false